[project]
name = "mcpanel"
version = "0.1.0"
description = "mcpanel: daemon + GUI for managing Minecraft Java Edition servers"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/mcpanel-common", "packages/mcpanel-daemon", "packages/mcpanel-gui"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1.380",
    "pyinstaller>=6.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["packages", "tests"]
exclude = ["**/.venv/**", "**/__pycache__/**"]
extraPaths = [
    "packages/mcpanel-common/src",
    "packages/mcpanel-daemon/src",
    "packages/mcpanel-gui/src",
]
