<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Minewrap</title>
  <!-- App tile: Minewrap dark palette, background #0f172a -->
  <rect width="512" height="512" rx="112" fill="#0f172a"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Isometric block: top / left / right faces -->
  <polygon points="256,96 400,179 256,262 112,179" fill="#4ade80"/>
  <polygon points="112,179 256,262 256,428 112,345" fill="#22c55e"/>
  <polygon points="256,262 400,179 400,345 256,428" fill="#16a34a"/>

  <!-- Wrap band: runs along the iso edges and sits just proud of the block -->
  <polygon points="106,231.5 256,318 256,358 106,271.5" fill="#f8fafc"/>
  <polygon points="256,318 406,231.5 406,271.5 256,358" fill="#cbd5e1"/>
</svg>
