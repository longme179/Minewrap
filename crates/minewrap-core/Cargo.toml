[package]
name = "minewrap-core"
version = "1.10.0"
edition = "2024"
description = "Tauri-free core for Minewrap: process lifecycle, logs, config"
license = "AGPL-3.0-only"

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "process", "io-util", "time", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
