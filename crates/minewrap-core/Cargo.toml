[package]
name = "minewrap-core"
version = "0.1.0"
edition = "2024"
description = "Tauri-free core for Minewrap: process lifecycle, logs, config"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["rt", "sync", "process", "io-util", "time", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc", "serde"] }
