[package]
name = "minewrap-remote"
version = "1.10.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "reqwest client for remote minewrapd nodes"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc", "serde"] }
toml = "0.8"
