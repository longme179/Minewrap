# mcpanel daemon configuration — copy to config.toml and edit.
# Relative paths (data_dir, work_dir) resolve against this file's directory.
# This file may hold secrets (webhook_url, token): keep it mode 0600.

[daemon]
host = "127.0.0.1"        # Bind address. Loopback is the default and recommended.
                          # Remote access: SSH port-forward or reverse proxy + TLS.
                          # See docs/remote-access.md.
port = 8080
data_dir = "./data"       # Generated token, Discord message state, rotated logs.
# token = "..."           # Optional: pin the API token instead of auto-generating
                          # one into data_dir/token on first run (printed once).
status_poll_interval = 15        # Seconds between mcstatus probes per instance.
unresponsive_after_failures = 2  # Consecutive probe failures -> "unresponsive".

[daemon.defaults]         # Per-instance defaults; each [[instances]] may override.
startup_timeout = 300     # Seconds to wait for the "Done" line before giving up.
stop_timeout = 60         # Seconds after "stop" before SIGTERM, then SIGKILL.
kill_grace_seconds = 5    # Seconds between SIGTERM and SIGKILL during escalation.
done_regex = 'Done \(\d+(\.\d+)?s\)! For help'   # Configurable: log formats differ.
log_buffer_lines = 500    # In-memory ring buffer per instance.
log_max_bytes = 10485760  # Rotating log file size (10 MiB).
log_backups = 3           # Rotating log file backups kept.

[[instances]]
id = "survival"           # ^[a-z0-9_-]+$ ; immutable; used in API URLs.
name = "Survival"
work_dir = "/srv/minecraft/survival"   # Where the server jar + world live.
java_path = "java"
jvm_args = ["-Xms2G", "-Xmx4G"]
launch_args = ["-jar", "server.jar", "nogui"]
autostart = false         # Start this instance when the daemon starts.

[instances.probe]
host = "127.0.0.1"        # Address the daemon probes via the server-list ping.
port = 25565
query_enabled = true      # Also poll the Query protocol for player names.
query_port = 25565        # Optional; defaults to the probe port.
timeout = 3.0             # mcstatus timeout, seconds.

[instances.restart]
policy = "on-crash"       # "never" | "on-crash"
max_retries = 5           # Consecutive crashes before giving up (restart-loop).
backoff_base_seconds = 5
backoff_max_seconds = 300
reset_after_online_seconds = 600   # Online this long -> crash counter resets.

[instances.rcon]          # Optional. TPS probing is behind a feature flag (future).
enabled = false
host = "127.0.0.1"
port = 25575
password_env = "MC_RCON_PASSWORD"   # Env var name; the password never lives here.

[instances.discord]
enabled = false
# Secret: never committed, never logged. Stored write-only via the API.
webhook_url = "https://discord.com/api/webhooks/REPLACE_ME"
mode = "edit-in-place"    # "edit-in-place" (update one message) | "new-message"
interval_seconds = 600    # Status+log update cadence.
first_push_delay_seconds = 10
log_lines = 15            # Last N log lines in the embed.
max_log_chars = 1500      # Hard cap on the log block (Discord limit: 4096).
state_change_posts = true # Extra immediate post on started/stopped/crashed/loop.
state_change_debounce_seconds = 30
redact_regexes = []       # Extra regexes to redact from logs before sending.
