[package]
name = "minewrap-tauri"
version = "1.10.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Tauri shell for Minewrap v2 (local node, IPC routing)"

[lib]
name = "minewrap_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "minewrap-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
minewrap-remote = { path = "../crates/minewrap-remote" }
tokio-tungstenite = "0.24"
futures-util = "0.3"
