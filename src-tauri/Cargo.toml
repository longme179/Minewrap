[package]
name = "minewrap-tauri"
version = "1.9.1"
edition = "2024"
license = "MIT"
description = "Tauri shell for Minewrap v2 (local node, IPC routing)"

[lib]
name = "minewrap_tauri"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "minewrap-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc", "serde"] }
minewrap-core = { path = "../crates/minewrap-core" }
minewrap-remote = { path = "../crates/minewrap-remote" }
