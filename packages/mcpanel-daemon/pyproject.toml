[project]
name = "mcpanel-daemon"
version = "0.1.0"
description = "Headless node daemon for mcpanel"
requires-python = ">=3.12"
dependencies = [
    "mcpanel-common",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcstatus>=12",
    "tomli-w>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpanel_daemon"]

[tool.uv.sources]
mcpanel-common = { workspace = true }
