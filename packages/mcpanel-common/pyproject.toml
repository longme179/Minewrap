[project]
name = "mcpanel-common"
version = "0.1.0"
description = "Shared pydantic models (config schema + API contract) for mcpanel"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpanel_common"]
