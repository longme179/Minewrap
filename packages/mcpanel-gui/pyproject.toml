[project]
name = "mcpanel-gui"
version = "0.1.0"
description = "PySide6 desktop client for mcpanel"
requires-python = ">=3.12"
dependencies = [
    "mcpanel-common",
    "PySide6-Essentials>=6.7",
    "httpx>=0.27",
    "websockets>=13",
    "keyring>=25",
    "platformdirs>=4",
    "tomli-w>=1.0",
]

[project.scripts]
mcpanel-gui = "mcpanel_gui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpanel_gui"]

[tool.uv.sources]
mcpanel-common = { workspace = true }
