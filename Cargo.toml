[workspace]
resolver = "2"
members = ["crates/minewrap-core", "crates/fake-mc-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "sync", "process", "io-util", "time", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc", "serde"] }

[profile.dev]
debug = true

[profile.release]
lto = true
codegen-units = 1
strip = true
