[workspace]
resolver = "2"
members = ["crates/minewrap-core", "crates/minewrapd", "crates/minewrap-remote", "src-tauri"]
exclude = []

[workspace.package]
version = "1.9.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "sync", "process", "io-util", "time", "signal", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "alloc", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.dev]
debug = true
# Warnings are errors for the workspace (Phase 6 linter bar).
[workspace.lints.rust]
warnings = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
